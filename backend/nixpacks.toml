# Railway Nixpacks 配置
# 老王说：确保执行 npm run build 生成 dist 目录
# 强制重新构建 - 2026-03-02

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --legacy-peer-deps --include=dev"]

[phases.build]
cmds = ["npm run prisma:generate", "npm run build"]

[start]
cmd = "npm run prisma:deploy && node dist/main.js"
