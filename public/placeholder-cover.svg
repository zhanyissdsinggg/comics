<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="300" height="400" fill="url(#bgGradient)"/>

  <!-- 书籍图标 -->
  <g transform="translate(150, 200)">
    <!-- 书籍左页 -->
    <rect x="-60" y="-80" width="55" height="160" fill="#10b981" opacity="0.8"/>
    <!-- 书籍右页 -->
    <rect x="-5" y="-80" width="55" height="160" fill="#06b6d4" opacity="0.8"/>
    <!-- 书脊 -->
    <rect x="-5" y="-80" width="10" height="160" fill="#059669"/>
  </g>

  <!-- 文字提示 -->
  <text x="150" y="350" font-size="16" fill="#9ca3af" text-anchor="middle" font-family="Arial">
    Placeholder Cover
  </text>
</svg>