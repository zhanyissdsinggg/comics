name: OPS SOP Automation

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "30 2 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: "SOP profile to run"
        required: true
        default: "deploy"
        type: choice
        options:
          - daily
          - deploy
          - weekly
      backend_url:
        description: "Backend base URL (optional, fallback to vars.PROD_BACKEND_URL)"
        required: false
        default: ""
        type: string
      frontend_url:
        description: "Frontend base URL (optional, fallback to vars.PROD_FRONTEND_URL)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ops-sop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sop:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      DEFAULT_BACKEND_URL: https://www.gushcomics.com
      DEFAULT_FRONTEND_URL: https://www.gushcomics.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve profile and targets
        id: resolve
        env:
          INPUT_PROFILE: ${{ github.event.inputs.profile }}
          INPUT_BACKEND_URL: ${{ github.event.inputs.backend_url }}
          INPUT_FRONTEND_URL: ${{ github.event.inputs.frontend_url }}
          BACKEND_URL_FROM_VAR: ${{ vars.PROD_BACKEND_URL }}
          FRONTEND_URL_FROM_VAR: ${{ vars.PROD_FRONTEND_URL }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          PROFILE="${INPUT_PROFILE}"
          if [ -z "$PROFILE" ]; then
            if [ "$EVENT_SCHEDULE" = "30 2 * * 1" ]; then
              PROFILE="weekly"
            else
              PROFILE="daily"
            fi
          fi

          BACKEND_URL="${INPUT_BACKEND_URL:-$BACKEND_URL_FROM_VAR}"
          FRONTEND_URL="${INPUT_FRONTEND_URL:-$FRONTEND_URL_FROM_VAR}"
          BACKEND_URL="${BACKEND_URL:-$DEFAULT_BACKEND_URL}"
          FRONTEND_URL="${FRONTEND_URL:-$DEFAULT_FRONTEND_URL}"

          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        if: ${{ steps.resolve.outputs.profile == 'daily' }}
        run: npm install --prefix frontend --no-audit --no-fund

      - name: Install Playwright Chromium
        if: ${{ steps.resolve.outputs.profile == 'daily' }}
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Validate required secrets for deploy profile
        if: ${{ steps.resolve.outputs.profile == 'deploy' }}
        env:
          OBSERVABILITY_KEY: ${{ secrets.OBSERVABILITY_KEY }}
          PROD_ADMIN_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}
          PROD_ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          HAS_OBSERVABILITY=0
          HAS_PROD_ADMIN_EMAIL=0
          HAS_PROD_ADMIN_PASSWORD=0
          HAS_ADMIN_EMAIL=0
          HAS_ADMIN_PASSWORD=0

          if [ -n "$OBSERVABILITY_KEY" ]; then HAS_OBSERVABILITY=1; fi
          if [ -n "$PROD_ADMIN_EMAIL" ]; then HAS_PROD_ADMIN_EMAIL=1; fi
          if [ -n "$PROD_ADMIN_PASSWORD" ]; then HAS_PROD_ADMIN_PASSWORD=1; fi
          if [ -n "$ADMIN_EMAIL" ]; then HAS_ADMIN_EMAIL=1; fi
          if [ -n "$ADMIN_PASSWORD" ]; then HAS_ADMIN_PASSWORD=1; fi

          echo "Deploy secrets readiness:"
          echo "  OBSERVABILITY_KEY=$HAS_OBSERVABILITY"
          echo "  PROD_ADMIN_EMAIL=$HAS_PROD_ADMIN_EMAIL"
          echo "  PROD_ADMIN_PASSWORD=$HAS_PROD_ADMIN_PASSWORD"
          echo "  ADMIN_EMAIL=$HAS_ADMIN_EMAIL"
          echo "  ADMIN_PASSWORD=$HAS_ADMIN_PASSWORD"

          MISSING=()
          if [ "$HAS_OBSERVABILITY" -ne 1 ]; then
            MISSING+=("OBSERVABILITY_KEY")
          fi

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "Missing required deploy secrets: ${MISSING[*]}" >&2
            exit 1
          fi

      - name: Preflight admin login for deploy profile
        id: admin_preflight
        continue-on-error: true
        if: ${{ steps.resolve.outputs.profile == 'deploy' }}
        env:
          BACKEND_URL: ${{ steps.resolve.outputs.backend_url }}
          PROD_ADMIN_EMAIL: ${{ secrets.PROD_ADMIN_EMAIL }}
          PROD_ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          node -e "
          const fs = require('node:fs');
          const backend = String(process.env.BACKEND_URL || '').replace(/\/$/, '');
          const candidates = [
            { source: 'prod', email: String(process.env.PROD_ADMIN_EMAIL || '').trim(), password: String(process.env.PROD_ADMIN_PASSWORD || '').trim() },
            { source: 'legacy', email: String(process.env.ADMIN_EMAIL || '').trim(), password: String(process.env.ADMIN_PASSWORD || '').trim() },
          ].filter((item) => item.email && item.password);
          if (!backend || candidates.length === 0) {
            console.error('[ops-preflight] missing backend/admin credentials for login preflight');
            process.exit(1);
          }

          const url = backend + '/api/admin/auth/login';
          (async () => {
            let lastError = null;
            for (const item of candidates) {
              const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ email: item.email, password: item.password }),
              });
              const bodyText = await response.text();
              const compactBody = String(bodyText || '').replace(/\s+/g, ' ').slice(0, 300);
              console.log('[ops-preflight] source=' + item.source + ' admin login status=' + response.status);
              if ([200, 201].includes(response.status)) {
                fs.appendFileSync(process.env.GITHUB_OUTPUT, 'credential_source=' + item.source + '\n');
                console.log('[ops-preflight] admin login preflight passed source=' + item.source);
                return;
              }
              lastError = compactBody || ('status=' + response.status);
            }
            console.error('[ops-preflight] admin login preflight failed for all credential sources: ' + String(lastError || 'unknown'));
            process.exit(1);
          })().catch((error) => {
            console.error('[ops-preflight] admin login preflight crashed error=' + (error?.message || String(error)));
            process.exit(1);
          });
          "

      - name: Run SOP profile (daily/weekly)
        if: ${{ steps.resolve.outputs.profile != 'deploy' }}
        env:
          BACKEND_URL: ${{ steps.resolve.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.resolve.outputs.frontend_url }}
          OBSERVABILITY_KEY: ${{ secrets.OBSERVABILITY_KEY }}
          OPS_ADMIN_WRITE_ALLOWED: "1"
          OPS_SOP_RETRY_TIMES: "1"
        run: npm run ops:sop:${{ steps.resolve.outputs.profile }}

      - name: Run deploy baseline gate (blocking)
        if: ${{ steps.resolve.outputs.profile == 'deploy' }}
        env:
          BACKEND_URL: ${{ steps.resolve.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.resolve.outputs.frontend_url }}
          OBSERVABILITY_KEY: ${{ secrets.OBSERVABILITY_KEY }}
          OPS_ADMIN_WRITE_ALLOWED: "1"
        run: npm run ops:deploy-gate:strict

      - name: Run deploy extended admin suite (non-blocking)
        continue-on-error: true
        if: ${{ steps.resolve.outputs.profile == 'deploy' && steps.admin_preflight.outcome == 'success' }}
        env:
          BACKEND_URL: ${{ steps.resolve.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.resolve.outputs.frontend_url }}
          OBSERVABILITY_KEY: ${{ secrets.OBSERVABILITY_KEY }}
          OPS_ADMIN_EMAIL: ${{ steps.admin_preflight.outputs.credential_source == 'legacy' && secrets.ADMIN_EMAIL || secrets.PROD_ADMIN_EMAIL }}
          OPS_ADMIN_PASSWORD: ${{ steps.admin_preflight.outputs.credential_source == 'legacy' && secrets.ADMIN_PASSWORD || secrets.PROD_ADMIN_PASSWORD }}
          OPS_ADMIN_WRITE_ALLOWED: "1"
          OPS_SOP_RETRY_TIMES: "1"
        run: npm run ops:sop:deploy

      - name: Note deploy admin suite status
        if: ${{ steps.resolve.outputs.profile == 'deploy' }}
        run: |
          echo "[ops-sop] deploy baseline is blocking; admin preflight/extended suite are advisory in soft mode."
          echo "[ops-sop] preflight outcome=${{ steps.admin_preflight.outcome }}"

      - name: Upload SOP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-sop-${{ steps.resolve.outputs.profile }}-${{ github.run_id }}
          path: |
            frontend/.tmp-admin-audit/live-interactions/latest.json
            frontend/.tmp-admin-audit/live-interactions/latest.txt
            frontend/.tmp-admin-audit/live-interactions/*.png
            ops-watchdog-report.md
            ops-watchdog-report.json
            docs/operations/admin-route-inventory.md
            docs/operations/admin-route-inventory.json
          if-no-files-found: warn
