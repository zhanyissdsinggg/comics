name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix backend

      - name: Lint
        run: npm run lint --prefix backend

      - name: Build
        run: npm run build --prefix backend

      - name: OpenAPI Contract Check
        run: npm run contract:check --prefix backend

      - name: Unit Tests
        run: npm run test --prefix backend -- --runInBand --passWithNoTests

      - name: E2E Smoke Tests
        run: npm run test:e2e --prefix backend

      - name: Integration Tests (skip unless enabled)
        run: npm run test:integration --prefix backend

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gush
          POSTGRES_PASSWORD: gush
          POSTGRES_DB: gush_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gush -d gush_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix backend

      - name: Run dependency integration tests
        env:
          INTEGRATION_TESTS: "1"
          DATABASE_URL: postgresql://gush:gush@localhost:5432/gush_test?schema=public
          REDIS_URL: redis://localhost:6379
        run: npm run test:integration --prefix backend

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Frontend Quality Gate
        run: npm run check:all --prefix frontend

  frontend-browser-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: npm run test:e2e:browser --prefix frontend

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Dependency security gate
        run: npm run security:check

      - name: Comment encoding hygiene gate
        run: npm run hygiene:check
