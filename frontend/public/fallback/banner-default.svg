<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1400" role="img" aria-labelledby="title desc">
  <title id="title">Gush login fallback banner</title>
  <desc id="desc">Default login background fallback for Gush.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324" />
      <stop offset="50%" stop-color="#1d2840" />
      <stop offset="100%" stop-color="#090b12" />
    </linearGradient>
  </defs>
  <rect width="1800" height="1400" fill="url(#bg)" />
  <circle cx="280" cy="260" r="220" fill="#67e8f9" fill-opacity="0.14" />
  <circle cx="1380" cy="340" r="260" fill="#ff4f9a" fill-opacity="0.1" />
  <circle cx="980" cy="1180" r="280" fill="#ffe500" fill-opacity="0.08" />
  <text x="180" y="760" fill="#ffffff" font-family="Arial, sans-serif" font-size="120" font-weight="800">Late-night</text>
  <text x="180" y="900" fill="#ffffff" font-family="Arial, sans-serif" font-size="120" font-weight="800">reading starts here</text>
  <text x="184" y="1000" fill="#ffffff" fill-opacity="0.72" font-family="Arial, sans-serif" font-size="40" font-weight="600">Default fallback banner for Gush sign-in surfaces.</text>
</svg>
